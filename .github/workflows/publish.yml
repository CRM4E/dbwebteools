name: publish-candidate
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: publish-candidate
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to create/move tags safely

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Publish API
        run: dotnet publish backend/DbWeb.Api/DbWeb.Api.csproj -c Release -r linux-x64 --self-contained true -o out/api

      - name: Build web frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          mkdir -p out/web
          cp -R frontend/dist/. out/web/

      - name: Package application
        run: cd out && zip -r ../yourapp-linux-x64.zip api web

      - name: Delete candidateX release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="candidateX"

          # Delete the existing release if present (ignore if missing)
          gh release delete "$TAG" -y >/dev/null 2>&1 || true
      
      - name: Move candidateX tag to this commit (force)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f candidateX "$GITHUB_SHA"
          git push -f origin refs/tags/candidateX

      - name: Update candidateX release asset + notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="candidateX"

          # Create a fresh prerelease attached to the current commit
          gh release create "$TAG" yourapp-linux-x64.zip \
            --prerelease \
            --title "Candidate" \
            --notes "commit=${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
